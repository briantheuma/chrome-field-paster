<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field Paster</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <svg class="logo" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="2" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <path d="M7 7h6M7 10h6M7 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <rect x="8" y="0.5" width="4" height="3" rx="1" fill="currentColor"/>
        </svg>
        <span class="title">Field Paster</span>
      </div>
      <button id="edit-toggle" class="btn-edit">
        <svg id="edit-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M11.5 2.5a1.414 1.414 0 0 1 2 2L5 13H3v-2L11.5 2.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        <svg id="cancel-icon" class="hidden" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span id="edit-label">Edit</span>
      </button>
    </header>

    <!-- View Mode -->
    <div id="view-mode">
      <div id="fields-list"></div>
      <p id="empty-state" class="hidden">No fields yet.<br>Click <strong>Edit</strong> to add some.</p>
    </div>

    <!-- Edit Mode -->
    <div id="edit-mode" class="hidden">
      <div id="edit-fields-list"></div>
      <button id="add-field">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Add Field
      </button>
      <div class="edit-actions">
        <button id="cancel-btn" class="btn-secondary">Cancel</button>
        <button id="save-btn" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden">Copied!</div>

  <script src="popup.js"></script>
</body>
</html>
